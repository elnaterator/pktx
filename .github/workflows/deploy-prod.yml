name: Deploy prod

# Publishing a GitHub Release (tag v*) promotes the image dev already verified for
# that commit — never a rebuild:
#   Resolve release ─► Deploy prod (production reviewer) ─► Smoke test prod
# Rollback: run this workflow by hand with an older release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (an older tag = rollback)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  TF_IN_AUTOMATION: "true"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  resolve:
    name: Resolve release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::'$TAG' is not a release tag (vYYYY.MM.DD[.N])"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: scripts/deploy
      - name: Resolve commit
        id: commit
        run: |
          sha="$(git rev-parse 'HEAD^{commit}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Release \`${TAG}\` → commit \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy prod
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewer gate. Promote + apply share this one job so the run
    # asks for approval once.
    environment:
      name: production
      url: ${{ steps.apply.outputs.url }}
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.apply.outputs.url }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # Infra + scripts at the release's commit: a rollback restores that
      # release's infra along with its image.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      # Checksum-verified by the Go module proxy.
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: pktx-prod-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure ECR repo
        run: scripts/deploy/ensure-base.sh prod
      - name: Promote dev-verified image (same digest)
        id: promote
        run: |
          digest="$(scripts/deploy/promote.sh "$SHA")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: terraform apply (pinned to digest)
        id: apply
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          url="$(scripts/deploy/apply.sh prod "$DIGEST" "$TAG")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ${TAG} to prod"
            echo "- commit \`${SHA}\`"
            echo "- image \`${DIGEST}\` (same digest dev verified)"
            echo "- ${url}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test prod
    needs: [resolve, deploy]
    # Plain HTTP checks against the public URL: no AWS credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts/deploy
      - name: Smoke test
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: scripts/deploy/smoke.sh "$URL" "$TAG"
