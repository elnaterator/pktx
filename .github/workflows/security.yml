name: Security

# PRs gate on new findings; the weekly run catches CVEs published against code that
# hasn't changed (mostly base-image OS packages). Deploys stay manual (make deploy).
on:
  pull_request:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.75.0

jobs:
  # PRs already audit deps via `make check` in ci.yml; this covers the weekly run.
  deps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: make -C backend audit
      - run: make -C frontend audit

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - run: docker build --pull -t pktx-scan .
      - name: Trivy image (SARIF, all severities)
        run: trivy image --format sarif --output trivy-image.sarif pktx-scan
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image gate (HIGH/CRITICAL with a fix)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed pktx-scan

  iac-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Trivy IaC + secrets (SARIF)
        run: >-
          trivy fs --scanners misconfig,secret
          --format sarif --output trivy-repo.sarif .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Trivy IaC gate (HIGH/CRITICAL)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL infra/
      - name: Trivy secret gate
        run: trivy fs --scanners secret --exit-code 1 --severity MEDIUM,HIGH,CRITICAL .
