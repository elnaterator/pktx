services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pktx
      POSTGRES_PASSWORD: pktx
      POSTGRES_DB: pktx
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pktx"]
      interval: 5s
      timeout: 3s
      retries: 5

  pktx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PKTX_PORT=8000
      - PKTX_DB_URL=postgresql://pktx:pktx@postgres:5432/pktx
      - PKTX_FRONTEND_DIR=/app/frontend-dist
      - LOG_LEVEL=INFO
      - PKTX_PUBLIC_URL=${PKTX_PUBLIC_URL}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_ISSUER=${CLERK_ISSUER}
      - CLERK_OAUTH_CLIENT_ID=${CLERK_OAUTH_CLIENT_ID}
      - CLERK_OAUTH_CLIENT_SECRET=${CLERK_OAUTH_CLIENT_SECRET}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      # Origins whose Clerk session JWTs (azp claim) the REST API accepts.
      - CLERK_AUTHORIZED_PARTIES=${CLERK_AUTHORIZED_PARTIES:-http://localhost:8000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  pg-data:
